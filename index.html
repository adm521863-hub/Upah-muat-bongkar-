<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Hitung Muat & Bongkar - Terminal Cargo</title>
    
    <!-- Load React, ReactDOM, Babel & Tailwind -->
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load SheetJS for Excel Processing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Load HTML2PDF for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase Cloud Storage Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};

        try {
            const app = initializeApp(firebaseConfig);
            const auth = getAuth(app);
            const db = getFirestore(app);

            window.firebaseDB = db;
            window.firebaseAuth = auth;
            window.fb = { collection, doc, setDoc, deleteDoc, onSnapshot, signInAnonymously, signInWithCustomToken };
            window.appId = appId;
            window.firebaseReady = true;
            window.dispatchEvent(new Event('firebase-ready'));
        } catch(e) {
            console.error("Firebase init failed:", e);
        }
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; padding: 0; overflow: hidden; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00d4ff; }

        .prism-accent { color: #00d4ff; }
        .prism-bg { background-color: #00d4ff; }
        
        /* Print Styles - Rapi, Hitam Putih untuk Kertas A4 */
        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; color: black !important; background: white !important; font-size: 12px; }
            .no-print { display: none !important; }
        }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const formatRupiah = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0);
        const MUAT_RATES = { 'belum': 0, 'gudang': 0, 'joni': 7000, 'tentative': 3500 };

        // Komponen Sapaan Dinamis
        const Greeting = () => {
            const [time, setTime] = React.useState(new Date());
            React.useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 60000);
                return () => clearInterval(timer);
            }, []);

            const hour = time.getHours();
            let greeting = 'Malam';
            if (hour >= 5 && hour < 11) greeting = 'Pagi';
            else if (hour >= 11 && hour < 15) greeting = 'Siang';
            else if (hour >= 15 && hour < 18) greeting = 'Sore';

            return (
                <div className="flex flex-col items-end hidden sm:flex">
                    <span className="text-sm font-bold text-gray-900">Selamat {greeting}, Admin</span>
                    <span className="text-[10px] text-gray-800 font-semibold opacity-90">Jangan lupa makan, banyak minum air putih & jaga kesehatan! 💧</span>
                </div>
            );
        };

        const App = () => {
            const [containers, setContainers] = React.useState([]);
            const [activeTab, setActiveTab] = React.useState('dashboard'); 
            const [isSidebarOpen, setIsSidebarOpen] = React.useState(true);
            const [isUploading, setIsUploading] = React.useState(false);
            
            // Sinkronisasi Data Firebase (Cloud Storage)
            React.useEffect(() => {
                const initFirebase = async () => {
                    if (!window.firebaseReady || !window.firebaseAuth) return;
                    try {
                        if (typeof __initial_auth_token !== 'undefined') {
                            await window.fb.signInWithCustomToken(window.firebaseAuth, __initial_auth_token);
                        } else {
                            await window.fb.signInAnonymously(window.firebaseAuth);
                        }
                        const user = window.firebaseAuth.currentUser;
                        if (!user) return;

                        const containersRef = window.fb.collection(window.firebaseDB, 'artifacts', window.appId, 'public', 'data', 'containers');

                        window.fb.onSnapshot(containersRef, (snapshot) => {
                            const loaded = [];
                            snapshot.forEach((doc) => loaded.push(Object.assign({ id: doc.id }, doc.data())));
                            loaded.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                            setContainers(loaded);
                        }, (err) => console.error(err));
                    } catch (error) {
                        console.error("Firebase Auth Error:", error);
                    }
                };

                if (window.firebaseReady) initFirebase();
                else {
                    window.addEventListener('firebase-ready', initFirebase);
                    return () => window.removeEventListener('firebase-ready', initFirebase);
                }
            }, []);

            // Modal & Global States
            const [activeModal, setActiveModal] = React.useState(null); 
            const [activeContainerId, setActiveContainerId] = React.useState(null);
            
            // Form States
            const [bulkDate, setBulkDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [bulkStatus, setBulkStatus] = React.useState('joni');
            const [rekapDate, setRekapDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [bongkarForm, setBongkarForm] = React.useState({ size: '40ft', people: 10 });
            
            const [isDownloading, setIsDownloading] = React.useState(false);
            const [confirmDeleteId, setConfirmDeleteId] = React.useState(null);

            // Responsive Sidebar: Auto close on mobile
            React.useEffect(() => {
                if (window.innerWidth < 768) {
                    setIsSidebarOpen(false);
                }
            }, []);

            const handleMultipleUpload = (e) => {
                const files = e.target.files;
                if (!files || files.length === 0) return;
                setIsUploading(true);

                Array.from(files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        try {
                            const bstr = evt.target.result;
                            const wb = XLSX.read(bstr, { type: 'binary' });
                            const wsname = wb.SheetNames[0];
                            const ws = wb.Sheets[wsname];
                            const data = XLSX.utils.sheet_to_json(ws, { header: 1 });

                            let extractedItems = [];
                            let format = 'UNKNOWN';
                            let headerRowIndex = -1;
                            
                            let markIdx = -1, ctnIdx = -1, gwIdx = -1, cbmIdx = -1, addrIdx = -1;

                            for (let i = 0; i < Math.min(30, data.length); i++) {
                                const row = data[i] || [];
                                const headers = Array.from(row).map(h => (h || '').toString().toLowerCase().replace(/\s+/g, ''));
                                
                                markIdx = headers.findIndex(h => h && (h === 'mark' || h.includes('marking')));
                                ctnIdx = headers.findIndex(h => h && (h.includes('totalpacking') || h.includes('quantity') || h.includes('ctn') || h === 'qty'));
                                cbmIdx = headers.findIndex(h => h && h.includes('cbm'));
                                gwIdx = headers.findIndex(h => h && (h.includes('weight') || h.includes('g.w')));
                                addrIdx = headers.findIndex(h => h && (h.includes('address') || h.includes('alamat') || h.includes('consignee')));
                                
                                const cnidMark = (row[0] || '').toString().toLowerCase().replace(/\s+/g, '');
                                const cnidCtn = (row[4] || '').toString().toLowerCase().replace(/\s+/g, '');
                                
                                if (markIdx > -1 && ctnIdx > -1 && cbmIdx > -1) {
                                    format = 'DYNAMIC_TN_GLX';
                                    headerRowIndex = i;
                                    break;
                                } else if (cnidMark.includes('marking') && cnidCtn.includes('ctn')) {
                                    format = 'CNID';
                                    headerRowIndex = i;
                                    break;
                                }
                            }

                            if (format === 'DYNAMIC_TN_GLX') {
                                for (let i = headerRowIndex + 1; i < data.length; i++) {
                                    const row = data[i] || [];
                                    if (row.length === 0) continue;
                                    
                                    const markVal = (row[markIdx] || '').toString().trim();
                                    if (!markVal) continue;
                                    if (markVal.toUpperCase().includes('TOTAL')) break; 

                                    extractedItems.push({
                                        id: 'item_' + Date.now() + Math.random(),
                                        marking: markVal,
                                        ctn: parseFloat(row[ctnIdx]) || 0,
                                        cbm: parseFloat(row[cbmIdx]) || 0,
                                        gw: gwIdx > -1 ? parseFloat(row[gwIdx]) || 0 : 0,
                                        address: addrIdx > -1 ? (row[addrIdx] || '').toString().trim() : '-'
                                    });
                                }
                            } 
                            else if (format === 'CNID') {
                                for (let i = headerRowIndex + 1; i < data.length; i++) {
                                    const row = data[i] || [];
                                    if (row.length === 0) continue;
                                    
                                    const markVal = (row[0] || '').toString().trim();
                                    if (!markVal) continue;
                                    if (markVal.toUpperCase().includes('TOTAL')) break; 

                                    extractedItems.push({
                                        id: 'item_' + Date.now() + Math.random(),
                                        marking: markVal,
                                        ctn: parseFloat(row[4]) || 0,
                                        cbm: parseFloat(row[14]) || 0,
                                        gw: parseFloat(row[16]) || 0,
                                        address: '-'
                                    });
                                }
                            }

                            if (extractedItems.length > 0) {
                                extractedItems.sort((a, b) => a.address.localeCompare(b.address) || a.marking.localeCompare(b.marking));
                                
                                const newContainer = {
                                    id: 'cnt_' + Date.now() + Math.random(),
                                    createdAt: Date.now(),
                                    name: file.name.replace('.xlsx', '').replace('.xls', ''),
                                    items: extractedItems,
                                    format: format === 'CNID' ? 'CNID' : 'TN/GLX',
                                    muatDates: {},
                                    muatStatuses: {},
                                    bongkarList: []
                                };
                                
                                if (window.firebaseReady && window.firebaseAuth.currentUser) {
                                    const docRef = window.fb.doc(window.fb.collection(window.firebaseDB, 'artifacts', window.appId, 'public', 'data', 'containers'), newContainer.id);
                                    window.fb.setDoc(docRef, newContainer);
                                } else {
                                    setContainers(prev => [newContainer, ...prev]);
                                }
                            } else {
                                alert('Upload Ditolak!\nSistem tidak dapat menemukan kolom Marking, CTN, dan CBM.');
                            }
                        } catch (err) {
                            console.error(err);
                            alert('Terjadi kesalahan sistem saat membaca file ' + file.name);
                        }
                    };
                    reader.readAsBinaryString(file);
                });
                setIsUploading(false);
                e.target.value = '';
                setActiveTab('environments');
            };

            const handleDelete = (id) => setConfirmDeleteId(id);
            const openAction = (action, containerId) => {
                setActiveContainerId(containerId);
                setActiveModal(action);
            };

            let currentContainer = null;
            for (let i = 0; i < containers.length; i++) {
                if (containers[i].id === activeContainerId) {
                    currentContainer = containers[i];
                    break;
                }
            }

            const updateContainer = (id, updates) => {
                if (window.firebaseReady && window.firebaseAuth.currentUser) {
                    const docRef = window.fb.doc(window.fb.collection(window.firebaseDB, 'artifacts', window.appId, 'public', 'data', 'containers'), id);
                    window.fb.setDoc(docRef, updates, { merge: true });
                } else {
                    setContainers(containers.map(c => c.id === id ? Object.assign({}, c, updates) : c));
                }
            };

            const applyBulkMuat = () => {
                if (!currentContainer) return;
                const newDates = Object.assign({}, currentContainer.muatDates || {});
                const newStats = Object.assign({}, currentContainer.muatStatuses || {});
                currentContainer.items.forEach(item => {
                    newDates[item.id] = bulkDate;
                    newStats[item.id] = bulkStatus;
                });
                updateContainer(currentContainer.id, { muatDates: newDates, muatStatuses: newStats });
            };

            const handleItemMuatChange = (itemId, field, value) => {
                if (!currentContainer) return;
                const key = field === 'date' ? 'muatDates' : 'muatStatuses';
                const newData = Object.assign({}, currentContainer[key] || {});
                newData[itemId] = value;
                updateContainer(currentContainer.id, { [key]: newData });
            };

            const calculateBongkar = () => {
                if (!currentContainer) return;
                const size = bongkarForm.size;
                const people = bongkarForm.people;
                
                let tarif = size === '45ft' ? 1000000 : size === '40ft' ? 800000 : 400000;
                let konsumsi = 30000;
                let insentif = people >= 10 ? 80000 : 0;
                let total = tarif + konsumsi + insentif;
                
                const record = { id: Date.now(), size: size, people: people, tarif: tarif, konsumsi: konsumsi, insentif: insentif, total: total, date: new Date().toISOString().split('T')[0] };
                const existList = currentContainer.bongkarList || [];
                updateContainer(currentContainer.id, { bongkarList: [].concat(existList, [record]) });
            };
            
            const deleteBongkar = (recId) => {
                if (!currentContainer) return;
                const existList = currentContainer.bongkarList || [];
                updateContainer(currentContainer.id, { bongkarList: existList.filter(r => r.id !== recId) });
            };

            const handleDownloadPDF = (type, cId = null, selectedDate = null) => {
                const c = cId ? containers.find(x => x.id === cId) : null;
                let filename = '';
                let content = '';

                const style = `
                    <style>
                        body { font-family: 'Helvetica', 'Arial', sans-serif; color: #111; }
                        .header { text-align: center; border-bottom: 2px solid #111; padding-bottom: 15px; margin-bottom: 20px; }
                        .header h2 { margin: 0 0 5px 0; font-size: 18px; text-transform: uppercase; }
                        .header h3 { margin: 0; font-size: 13px; font-weight: normal; color: #444; }
                        table { width: 100%; border-collapse: collapse; margin-bottom: 25px; font-size: 11px; }
                        th, td { border: 1px solid #444; padding: 7px; }
                        th { background-color: #f1f5f9; font-weight: bold; text-align: left; }
                        .text-right { text-align: right; }
                        .text-center { text-align: center; }
                        .section-title { font-size: 13px; font-weight: bold; margin: 20px 0 10px 0; background: #1e293b; color: #fff; padding: 6px 10px; border-radius: 4px; }
                        .summary-box { border: 1px solid #1e293b; padding: 10px; border-radius: 4px; width: 320px; float: right; margin-bottom: 20px; page-break-inside: avoid; }
                        .summary-row { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 12px;}
                        .summary-row.total { font-weight: bold; border-top: 1px solid #ccc; padding-top: 5px; font-size: 13px; }
                        .clearfix::after { content: ""; clear: both; display: table; }
                    </style>
                `;

                if (type === 'pl' && c) {
                    filename = `Packing_List_${c.name}`;
                    content = `
                        <div class="header">
                            <h2>PACKING LIST KONTAINER</h2>
                            <h3>Nama Kontainer: <b>${c.name}</b> | Total Item: ${c.items.length}</h3>
                        </div>
                        <table>
                            <thead><tr><th style="width:5%">No</th><th style="width:25%">Marking</th><th style="width:10%">QTY (CTN)</th><th style="width:10%">CBM</th><th style="width:15%">G.W (Kg)</th><th style="width:35%">Alamat</th></tr></thead>
                            <tbody>
                                ${c.items.map((item, i) => `<tr><td class="text-center">${i+1}</td><td><b>${item.marking}</b></td><td class="text-center">${item.ctn}</td><td class="text-center">${item.cbm.toFixed(2)}</td><td class="text-center">${item.gw.toFixed(2)}</td><td>${item.address}</td></tr>`).join('')}
                            </tbody>
                        </table>
                    `;
                } else if (type === 'rekap-container' && c) {
                    filename = `Laporan_Lengkap_${c.name}`;
                    
                    let bRows = ''; let tBongkar = 0;
                    (c.bongkarList || []).forEach((b, i) => {
                        bRows += `<tr><td class="text-center">${i+1}</td><td class="text-center">${b.date}</td><td class="text-center">${b.size}</td><td class="text-center">${b.people}</td><td class="text-right">${formatRupiah(b.total)}</td></tr>`;
                        tBongkar += b.total;
                    });

                    let mRows = ''; let tMuat = 0, tCbm = 0, tCtn = 0, mCount = 1;
                    c.items.forEach(itm => {
                        const stat = (c.muatStatuses && c.muatStatuses[itm.id]) ? c.muatStatuses[itm.id] : 'belum';
                        if (stat !== 'belum') {
                            const d = (c.muatDates && c.muatDates[itm.id]) ? c.muatDates[itm.id] : '-';
                            const upah = itm.cbm * (MUAT_RATES[stat] || 0);
                            mRows += `<tr><td class="text-center">${mCount++}</td><td class="text-center">${d}</td><td><b>${itm.marking}</b></td><td class="text-center">${itm.ctn}</td><td class="text-center">${itm.cbm.toFixed(2)}</td><td class="text-center">${stat.toUpperCase()}</td><td class="text-right">${formatRupiah(upah)}</td></tr>`;
                            tMuat += upah; tCbm += itm.cbm; tCtn += itm.ctn;
                        }
                    });

                    content = `
                        <div class="header">
                            <h2>REKAPITULASI BIAYA KONTAINER</h2>
                            <h3>Nama Kontainer: <b>${c.name}</b></h3>
                        </div>
                        
                        <div class="section-title">A. RINCIAN UPAH BONGKAR</div>
                        <table>
                            <thead><tr><th style="width:5%">No</th><th style="width:20%">Tanggal</th><th style="width:25%">Ukuran Kontainer</th><th style="width:25%">Jumlah Pekerja</th><th style="width:25%" class="text-right">Total Biaya (Rp)</th></tr></thead>
                            <tbody>${bRows || '<tr><td colspan="5" class="text-center">Belum ada data bongkar.</td></tr>'}</tbody>
                        </table>
                        <div class="text-right" style="margin-bottom: 25px;"><b>Subtotal Bongkar: ${formatRupiah(tBongkar)}</b></div>

                        <div class="section-title">B. RINCIAN UPAH MUAT</div>
                        <table>
                            <thead><tr><th style="width:5%">No</th><th style="width:15%">Tanggal</th><th style="width:30%">Marking</th><th style="width:10%">QTY</th><th style="width:10%">CBM</th><th style="width:15%">Pekerja</th><th style="width:15%" class="text-right">Total Biaya (Rp)</th></tr></thead>
                            <tbody>${mRows || '<tr><td colspan="7" class="text-center">Belum ada data muat.</td></tr>'}</tbody>
                        </table>
                        <div class="text-right" style="margin-bottom: 25px;"><b>Subtotal Muat: ${formatRupiah(tMuat)}</b></div>

                        <div class="clearfix">
                            <div class="summary-box">
                                <div class="summary-row total"><span>Total Upah Bongkar:</span><span>${formatRupiah(tBongkar)}</span></div>
                                <div class="summary-row total"><span>Total Upah Muat:</span><span>${formatRupiah(tMuat)}</span></div>
                                <div class="summary-row total" style="background:#1e293b; color:#fff; padding: 8px; margin-top: 10px; border-radius: 4px;"><span>GRAND TOTAL:</span><span>${formatRupiah(tBongkar + tMuat)}</span></div>
                            </div>
                        </div>
                    `;
                } else if (type === 'rekap-global' && selectedDate) {
                    filename = `Rekap_Global_${selectedDate}`;
                    let rows = '';
                    let gUpah = 0, gCbm = 0, gCtn = 0;
                    containers.forEach(cont => {
                        let count = 1;
                        const dates = cont.muatDates || {};
                        const stats = cont.muatStatuses || {};
                        cont.items.forEach(itm => {
                            if (dates[itm.id] === selectedDate && stats[itm.id] && stats[itm.id] !== 'belum') {
                                const upah = itm.cbm * (MUAT_RATES[stats[itm.id]] || 0);
                                rows += `<tr>
                                    <td><b>${count === 1 ? cont.name : ''}</b></td>
                                    <td class="text-center">${count}</td>
                                    <td><b>${itm.marking}</b></td>
                                    <td class="text-center">${itm.ctn}</td>
                                    <td class="text-center">${itm.cbm.toFixed(2)}</td>
                                    <td class="text-center">${stats[itm.id].toUpperCase()}</td>
                                    <td class="text-right">${formatRupiah(upah)}</td>
                                </tr>`;
                                gUpah += upah; gCbm += itm.cbm; gCtn += itm.ctn; count++;
                            }
                        });
                    });

                    content = `
                        <div class="header">
                            <h2>REKAPITULASI MUAT GLOBAL (HARIAN)</h2>
                            <h3>Tanggal Muat: <b>${selectedDate}</b></h3>
                        </div>
                        <table>
                            <thead><tr><th style="width:20%">Kontainer</th><th style="width:5%">No</th><th style="width:25%">Marking</th><th style="width:10%">QTY</th><th style="width:10%">CBM</th><th style="width:15%">Pekerja</th><th style="width:15%" class="text-right">Upah (Rp)</th></tr></thead>
                            <tbody>${rows || `<tr><td colspan="7" class="text-center">Tidak ada data muatan di tanggal ${selectedDate}</td></tr>`}</tbody>
                        </table>
                        <div class="clearfix">
                            <div class="summary-box">
                                <div class="summary-row"><span>Total Karton (CTN):</span><span>${gCtn}</span></div>
                                <div class="summary-row"><span>Total Volume (CBM):</span><span>${gCbm.toFixed(2)}</span></div>
                                <div class="summary-row total"><span>GRAND TOTAL UPAH:</span><span>${formatRupiah(gUpah)}</span></div>
                            </div>
                        </div>
                    `;
                }

                if (!content) return;

                const opt = {
                    margin:       [10, 10, 10, 10],
                    filename:     `${filename.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.pdf`,
                    image:        { type: 'jpeg', quality: 0.98 },
                    html2canvas:  { scale: 2, useCORS: true },
                    jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
                };

                const wrapper = document.createElement('div');
                wrapper.innerHTML = style + content;
                
                // Tambahkan wrapper ke body agar html2pdf bisa membacanya dengan sempurna (wajib untuk render PDF)
                wrapper.style.position = 'absolute';
                wrapper.style.left = '-9999px';
                document.body.appendChild(wrapper);

                setIsDownloading(true);
                html2pdf().set(opt).from(wrapper).save().then(() => {
                    document.body.removeChild(wrapper);
                    setIsDownloading(false);
                }).catch(err => {
                    console.error('PDF Error:', err);
                    document.body.removeChild(wrapper);

                    {/* Overlay Loading Download PDF */}
                    {isDownloading && (
                        <div className="fixed inset-0 z-[110] flex flex-col items-center justify-center bg-black/90 backdrop-blur-md animate-fade-in">
                            <div className="w-12 h-12 sm:w-16 sm:h-16 border-4 border-gray-800 border-t-[#00d4ff] rounded-full animate-spin mb-4 sm:mb-6 shadow-[0_0_20px_#00d4ff]"></div>
                            <div className="text-[#00d4ff] font-extrabold text-xl sm:text-2xl tracking-widest animate-pulse drop-shadow-md text-center">MENYUSUN PDF...</div>
                            <div className="text-gray-400 text-xs sm:text-sm mt-2 sm:mt-3 font-medium text-center px-6">Mohon tunggu, file akan terunduh ke perangkat Anda.</div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
