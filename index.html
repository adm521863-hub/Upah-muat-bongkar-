<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Hitung Muat & Bongkar - Terminal Cargo</title>
    
    <!-- Load React, ReactDOM, Babel & Tailwind -->
    <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load SheetJS for Excel Processing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; padding: 0; overflow: hidden; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #00d4ff; }
        
        /* Print Styles - Rapi, Hitam Putih untuk Kertas A4 */
        @media print {
            body { background: white !important; overflow: auto !important; height: auto !important; }
            #root { display: none !important; } /* Sembunyikan UI Web */
            #print-container { display: block !important; position: static !important; }
            #print-container * { visibility: visible; }
            
            .print-wrapper { color: black !important; background: white !important; font-size: 11px; padding: 20px; font-family: 'Arial', sans-serif; }
            .print-header { text-align: center; border-bottom: 2px solid black; padding-bottom: 10px; margin-bottom: 20px; }
            .print-header h2 { margin: 0 0 5px 0; font-size: 16px; text-transform: uppercase; }
            .print-header h3 { margin: 0; font-size: 12px; font-weight: normal; }
            .print-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
            .print-table th, .print-table td { border: 1px solid #444; padding: 6px; }
            .print-table th { background-color: #f1f5f9 !important; font-weight: bold; text-align: left; -webkit-print-color-adjust: exact; }
            .text-center { text-align: center; }
            .text-right { text-align: right; }
            .section-title { font-size: 12px; font-weight: bold; margin: 20px 0 10px 0; background: #e2e8f0 !important; padding: 5px; -webkit-print-color-adjust: exact; }
            .summary-box { border: 1px solid #444; padding: 10px; width: 300px; float: right; margin-bottom: 20px; page-break-inside: avoid; }
            .summary-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
            .summary-total { font-weight: bold; border-top: 1px solid #444; padding-top: 5px; margin-top: 5px; font-size: 12px; }
            .clearfix::after { content: ""; clear: both; display: table; }
        }
        
        #print-container { display: none; }
        
        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>
    <div id="print-container"></div> <!-- Penampung cetak khusus PDF -->

    <script type="text/babel">
        const formatRupiah = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0);
        const MUAT_RATES = { 'belum': 0, 'gudang': 0, 'joni': 7000, 'tentative': 3500 };

        // Komponen Sapaan Dinamis, Jam, Tanggal & Cuaca
        const Greeting = () => {
            const [time, setTime] = React.useState(new Date());
            const [weather, setWeather] = React.useState({ temp: '--', desc: 'Memuat cuaca...', icon: '🌤️' });

            React.useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000); // Tiap detik update
                
                // Mengambil data cuaca secara gratis (Otomatis deteksi wilayah secara umum)
                fetch('https://api.open-meteo.com/v1/forecast?latitude=-6.2088&longitude=106.8456&current_weather=true')
                    .then(res => res.json())
                    .then(data => {
                        const w = data.current_weather;
                        let desc = 'Cerah';
                        let icon = '☀️';
                        // Mengubah kode cuaca internasional ke bahasa Indonesia
                        if (w.weathercode >= 1 && w.weathercode <= 3) { desc = 'Berawan'; icon = '⛅'; }
                        else if (w.weathercode >= 51 && w.weathercode <= 67) { desc = 'Hujan'; icon = '🌧️'; }
                        else if (w.weathercode >= 80 && w.weathercode <= 99) { desc = 'Hujan Petir'; icon = '⛈️'; }
                        
                        setWeather({ temp: Math.round(w.temperature), desc, icon });
                    })
                    .catch(err => {
                        setWeather({ temp: '--', desc: 'Sistem cuaca offline', icon: '☁️' });
                    });

                return () => clearInterval(timer);
            }, []);

            const hour = time.getHours();
            let greeting = 'Malam';
            if (hour >= 5 && hour < 11) greeting = 'Pagi';
            else if (hour >= 11 && hour < 15) greeting = 'Siang';
            else if (hour >= 15 && hour < 18) greeting = 'Sore';

            const timeString = time.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            
            // Format Tanggal Keren (Contoh: Selasa, 22 Sep 2026)
            const dateString = time.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });

            return (
                <div className="flex flex-col items-end text-right">
                    <span className="text-sm font-extrabold text-gray-900">Selamat {greeting}, Admin • {timeString}</span>
                    <span className="text-xs text-gray-800 font-bold mt-0.5 flex items-center gap-1.5 hidden sm:flex">
                        📅 {dateString} <span className="opacity-40">|</span> {weather.icon} {weather.desc} ({weather.temp}°C)
                    </span>
                    <span className="text-[9px] text-gray-900/70 font-bold mt-0.5 hidden sm:block">Jangan lupa makan, banyak minum air putih & jaga kesehatan! 🫶🏻👻🖕🏻🤪</span>
                </div>
            );
        };

        const App = () => {
            // STATE DATA TERKONEKSI KE LOCAL STORAGE BROWSER (ANTI HILANG)
            const [containers, setContainers] = React.useState(() => {
                const savedData = localStorage.getItem('prismCargoData');
                if (savedData) {
                    try {
                        return JSON.parse(savedData);
                    } catch (e) {
                        return [];
                    }
                }
                return [];
            });

            // Menyimpan data setiap ada perubahan
            React.useEffect(() => {
                localStorage.setItem('prismCargoData', JSON.stringify(containers));
            }, [containers]);

            const [activeTab, setActiveTab] = React.useState('dashboard'); 
            const [isSidebarOpen, setIsSidebarOpen] = React.useState(true);
            const [isUploading, setIsUploading] = React.useState(false);
            
            const [activeModal, setActiveModal] = React.useState(null); 
            const [activeContainerId, setActiveContainerId] = React.useState(null);
            
            const [bulkDate, setBulkDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [bulkStatus, setBulkStatus] = React.useState('joni');
            const [rekapDate, setRekapDate] = React.useState(new Date().toISOString().split('T')[0]);
            
            // UPDATE: Biarkan people kosong ('') saat pertama kali agar user bisa langsung ketik
            const [bongkarForm, setBongkarForm] = React.useState({ size: '40ft', people: '' });
            
            const [confirmDeleteId, setConfirmDeleteId] = React.useState(null);

            React.useEffect(() => {
                if (window.innerWidth < 768) setIsSidebarOpen(false);
            }, []);

            const handleMultipleUpload = (e) => {
                const files = e.target.files;
                if (!files || files.length === 0) return;
                setIsUploading(true);

                Array.from(files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (evt) => {
                        try {
                            const bstr = evt.target.result;
                            const wb = XLSX.read(bstr, { type: 'binary' });
                            const wsname = wb.SheetNames[0];
                            const ws = wb.Sheets[wsname];
                            const data = XLSX.utils.sheet_to_json(ws, { header: 1 });

                            let extractedItems = [];
                            let format = 'UNKNOWN';
                            let headerRowIndex = -1;
                            
                            let markIdx = -1, ctnIdx = -1, gwIdx = -1, cbmIdx = -1, addrIdx = -1;

                            for (let i = 0; i < Math.min(30, data.length); i++) {
                                const row = data[i] || [];
                                const headers = Array.from(row).map(h => String(h || '').toLowerCase().replace(/\s+/g, ''));
                                
                                // PERBAIKAN KHUSUS CNID SESUAI INSTRUKSI PATEN
                                // Kolom E (index 4) = CTNS
                                // Kolom O (index 14) = TT CBM
                                const h4 = headers[4] || '';
                                const h14 = headers[14] || '';
                                
                                const isQty = h4.includes('ctn') || h4.includes('qty') || h4.includes('件数');
                                const isCbm = h14.includes('cbm') || h14.includes('体积');

                                // Deteksi CNID: Cukup cari CTNS di Kolom E dan CBM di Kolom O. (Abaikan Marking yang sering kosong)
                                if (isQty && isCbm) {
                                    format = 'CNID';
                                    headerRowIndex = i;
                                    break;
                                }

                                // Jika bukan CNID, cari dinamis format TN/GLX (Bisa dari kolom acak)
                                markIdx = headers.findIndex(h => h && (h === 'mark' || h.includes('marking') || h.includes('唛头')));
                                ctnIdx = headers.findIndex(h => h && (h.includes('totalpacking') || h.includes('quantity') || h.includes('ctn') || h === 'qty' || h.includes('件数')));
                                cbmIdx = headers.findIndex(h => h && (h.includes('cbm') || h.includes('体积')));
                                gwIdx = headers.findIndex(h => h && (h.includes('weight') || h.includes('g.w') || h.includes('毛重')));
                                addrIdx = headers.findIndex(h => h && (h.includes('address') || h.includes('alamat') || h.includes('consignee') || h.includes('收货人')));
                                
                                if (markIdx > -1 && ctnIdx > -1 && cbmIdx > -1) {
                                    format = 'DYNAMIC_TN_GLX';
                                    headerRowIndex = i;
                                    break;
                                }
                            }

                            if (format === 'DYNAMIC_TN_GLX') {
                                for (let i = headerRowIndex + 1; i < data.length; i++) {
                                    const row = data[i] || [];
                                    if (row.length === 0) continue;
                                    
                                    const markVal = String(row[markIdx] || '').trim();
                                    if (!markVal) continue;
                                    if (markVal.toUpperCase().includes('TOTAL') || markVal.includes('合计')) break; 

                                    extractedItems.push({
                                        id: 'item_' + Date.now() + Math.random(),
                                        marking: markVal,
                                        ctn: parseFloat(row[ctnIdx]) || 0,
                                        cbm: parseFloat(row[cbmIdx]) || 0,
                                        gw: gwIdx > -1 ? parseFloat(row[gwIdx]) || 0 : 0,
                                        address: addrIdx > -1 ? String(row[addrIdx] || '').trim() : '-'
                                    });
                                }
                            } 
                            else if (format === 'CNID') {
                                let currentMarking = "";
                                let currentAddress = "-";
                                let cnidMap = {}; // Penyimpanan sementara untuk menggabungkan data

                                for (let i = headerRowIndex + 1; i < data.length; i++) {
                                    const row = data[i] || [];
                                    if (row.length === 0) continue;
                                    
                                    const markVal = (row[0] || '').toString().trim();
                                    
                                    // Berhenti jika mendeteksi baris TOTAL di bawah
                                    if (markVal.toUpperCase().includes('TOTAL') || markVal.includes('合计') || (row[1] || '').toString().toUpperCase().includes('TOTAL')) break; 

                                    // Jika sel Marking ada isinya (tidak di-merge/kosong), update currentMarking
                                    // Jika kosong, sistem tetap pakai marking yang terakhir (currentMarking)
                                    if (markVal !== "") {
                                        currentMarking = markVal;
                                        
                                        // Cari alamat di kolom paling ujung untuk marking baru ini
                                        let addressVal = '-';
                                        if (row.length > 17) {
                                            for (let j = row.length - 1; j >= 17; j--) {
                                                if (row[j] && String(row[j]).trim() !== '') {
                                                    addressVal = String(row[j]).trim();
                                                    break;
                                                }
                                            }
                                        }
                                        currentAddress = addressVal;
                                    }

                                    // Abaikan baris kosong jika belum ada marking sama sekali di awal file
                                    if (!currentMarking) continue;

                                    // Ambil nilai QTY, CBM, GW di baris tersebut
                                    let ctnVal = parseFloat(row[4]) || 0;
                                    let cbmVal = parseFloat(row[14]) || 0;
                                    let gwVal = parseFloat(row[16]) || 0;

                                    // Jika tidak ada data yang bisa dihitung di baris itu, lewati
                                    if (ctnVal === 0 && cbmVal === 0) continue;

                                    // Masukkan dan gabungkan (akumulasi) ke dalam Map berdasarkan Marking
                                    if (!cnidMap[currentMarking]) {
                                        cnidMap[currentMarking] = {
                                            id: 'item_' + Date.now() + Math.random(),
                                            marking: currentMarking,
                                            ctn: 0,
                                            cbm: 0,
                                            gw: 0,
                                            address: currentAddress
                                        };
                                    }
                                    
                                    // Tambahkan jumlah QTY, CBM, dan GW dari sel yang ter-merge
                                    cnidMap[currentMarking].ctn += ctnVal;
                                    cnidMap[currentMarking].cbm += cbmVal;
                                    cnidMap[currentMarking].gw += gwVal;
                                }

                                // Ekstrak hasil gabungan ke array utama aplikasi
                                Object.values(cnidMap).forEach(item => {
                                    // Bersihkan angka desimal agar tidak terlalu panjang
                                    item.cbm = parseFloat(item.cbm.toFixed(3));
                                    item.gw = parseFloat(item.gw.toFixed(2));
                                    extractedItems.push(item);
                                });
                            }

                            if (extractedItems.length > 0) {
                                extractedItems.sort((a, b) => a.address.localeCompare(b.address) || a.marking.localeCompare(b.marking));
                                
                                const newContainer = {
                                    id: 'cnt_' + Date.now() + Math.random(),
                                    createdAt: Date.now(),
                                    name: file.name.replace('.xlsx', '').replace('.xls', ''),
                                    items: extractedItems,
                                    format: format === 'CNID' ? 'CNID' : 'TN/GLX',
                                    muatDates: {},
                                    muatStatuses: {},
                                    bongkarList: []
                                };
                                
                                // Simpan ke State (Otomatis tersimpan ke localStorage)
                                setContainers(prev => [newContainer, ...prev]);
                            } else {
                                alert('Upload Ditolak!\nSistem tidak dapat menemukan kolom paten (CTN dan CBM).');
                            }
                        } catch (err) {
                            console.error(err);
                            alert('Terjadi kesalahan sistem saat membaca file ' + file.name);
                        }
                    };
                    reader.readAsBinaryString(file);
                });
                setIsUploading(false);
                e.target.value = '';
                setActiveTab('environments');
            };

            const handleDelete = (id) => setConfirmDeleteId(id);
            const openAction = (action, containerId) => {
                setActiveContainerId(containerId);
                setActiveModal(action);
            };

            let currentContainer = null;
            for (let i = 0; i < containers.length; i++) {
                if (containers[i].id === activeContainerId) {
                    currentContainer = containers[i];
                    break;
                }
            }

            const updateContainer = (id, updates) => {
                setContainers(containers.map(c => c.id === id ? Object.assign({}, c, updates) : c));
            };

            const applyBulkMuat = () => {
                if (!currentContainer) return;
                const newDates = Object.assign({}, currentContainer.muatDates || {});
                const newStats = Object.assign({}, currentContainer.muatStatuses || {});
                currentContainer.items.forEach(item => {
                    newDates[item.id] = bulkDate;
                    newStats[item.id] = bulkStatus;
                });
                updateContainer(currentContainer.id, { muatDates: newDates, muatStatuses: newStats });
            };

            const handleItemMuatChange = (itemId, field, value) => {
                if (!currentContainer) return;
                const key = field === 'date' ? 'muatDates' : 'muatStatuses';
                const newData = Object.assign({}, currentContainer[key] || {});
                newData[itemId] = value;
                updateContainer(currentContainer.id, { [key]: newData });
            };

            // PERBAIKAN: Fungsi Hitung Upah Bongkar dengan Logika Progresif
            const calculateBongkar = () => {
                if (!currentContainer) return;
                const size = bongkarForm.size;
                
                // Pastikan angka valid, jika kosongan ubah jadi 0 saat mau dihitung
                const people = parseInt(bongkarForm.people) || 0; 
                
                if (people <= 0) {
                    alert('Silakan masukkan jumlah pekerja terlebih dahulu!');
                    return;
                }
                
                let tarif = size === '45ft' ? 1000000 : size === '40ft' ? 800000 : 400000;
                let konsumsi = 30000;
                let insentif = 0;
                
                // Logika insentif progresif yang benar
                if (size === '20ft' && people >= 5) {
                    insentif = 30000 + ((people - 5) * 10000);
                } else if (size === '40ft' && people >= 8) {
                    insentif = 40000 + ((people - 8) * 10000);
                } else if (size === '45ft' && people >= 10) {
                    insentif = 50000 + ((people - 10) * 10000);
                }
                
                let total = tarif + konsumsi + insentif;
                
                const record = { id: Date.now(), size: size, people: people, tarif: tarif, konsumsi: konsumsi, insentif: insentif, total: total, date: new Date().toISOString().split('T')[0] };
                const existList = currentContainer.bongkarList || [];
                updateContainer(currentContainer.id, { bongkarList: [].concat(existList, [record]) });
                
                // Reset kolom input jadi kosong setelah tambah data
                setBongkarForm(Object.assign({}, bongkarForm, { people: '' }));
            };
            
            const deleteBongkar = (recId) => {
                if (!currentContainer) return;
                const existList = currentContainer.bongkarList || [];
                updateContainer(currentContainer.id, { bongkarList: existList.filter(r => r.id !== recId) });
            };

            // FUNGSI PRINT NATIVE BROWSER (Aman & Tidak Akan Kosong)
            const handleNativePrint = (type, cId = null, selectedDate = null) => {
                const c = cId ? containers.find(x => x.id === cId) : null;
                let content = '';

                if (type === 'pl' && c) {
                    content = `
                        <div class="print-wrapper">
                            <div class="print-header">
                                <h2>PACKING LIST KONTAINER</h2>
                                <h3>Nama Kontainer: <b>${c.name}</b> | Total Item: ${c.items.length}</h3>
                            </div>
                            <table class="print-table">
                                <thead><tr><th style="width:5%">No</th><th style="width:25%">Marking</th><th style="width:10%" class="text-center">QTY (CTN)</th><th style="width:10%" class="text-center">CBM</th><th style="width:15%" class="text-center">G.W (Kg)</th><th style="width:35%">Alamat</th></tr></thead>
                                <tbody>
                                    ${c.items.map((item, i) => `<tr><td class="text-center">${i+1}</td><td><b>${item.marking}</b></td><td class="text-center">${item.ctn}</td><td class="text-center">${item.cbm.toFixed(2)}</td><td class="text-center">${item.gw.toFixed(2)}</td><td>${item.address}</td></tr>`).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                } else if ((type === 'rekap-container' || type === 'bongkar' || type === 'muat') && c) {
                    let bRows = ''; let tBongkar = 0;
                    (c.bongkarList || []).forEach((b, i) => {
                        bRows += `<tr><td class="text-center">${i+1}</td><td class="text-center">${b.date}</td><td class="text-center">${b.size}</td><td class="text-center">${b.people}</td><td class="text-right">${formatRupiah(b.total)}</td></tr>`;
                        tBongkar += b.total;
                    });

                    let mRows = ''; let tMuat = 0, tCbm = 0, tCtn = 0, mCount = 1;
                    c.items.forEach(itm => {
                        const stat = (c.muatStatuses && c.muatStatuses[itm.id]) ? c.muatStatuses[itm.id] : 'belum';
                        if (stat !== 'belum') {
                            const d = (c.muatDates && c.muatDates[itm.id]) ? c.muatDates[itm.id] : '-';
                            const upah = itm.cbm * (MUAT_RATES[stat] || 0);
                            mRows += `<tr><td class="text-center">${mCount++}</td><td class="text-center">${d}</td><td><b>${itm.marking}</b></td><td class="text-center">${itm.ctn}</td><td class="text-center">${itm.cbm.toFixed(2)}</td><td class="text-center">${stat.toUpperCase()}</td><td class="text-right">${formatRupiah(upah)}</td></tr>`;
                            tMuat += upah; tCbm += itm.cbm; tCtn += itm.ctn;
                        }
                    });

                    content = `
                        <div class="print-wrapper">
                            <div class="print-header">
                                <h2>REKAPITULASI BIAYA KONTAINER</h2>
                                <h3>Nama Kontainer: <b>${c.name}</b></h3>
                            </div>
                            
                            <div class="section-title">A. RINCIAN UPAH BONGKAR</div>
                            <table class="print-table">
                                <thead><tr><th style="width:5%">No</th><th style="width:20%" class="text-center">Tanggal</th><th style="width:25%" class="text-center">Ukuran Kontainer</th><th style="width:25%" class="text-center">Jumlah Pekerja</th><th style="width:25%" class="text-right">Total Biaya (Rp)</th></tr></thead>
                                <tbody>${bRows || '<tr><td colspan="5" class="text-center">Belum ada data bongkar.</td></tr>'}</tbody>
                            </table>
                            <div class="text-right" style="margin-bottom: 25px;"><b>Subtotal Bongkar: ${formatRupiah(tBongkar)}</b></div>

                            <div class="section-title">B. RINCIAN UPAH MUAT</div>
                            <table class="print-table">
                                <thead><tr><th style="width:5%">No</th><th style="width:15%" class="text-center">Tanggal</th><th style="width:30%">Marking</th><th style="width:10%" class="text-center">QTY</th><th style="width:10%" class="text-center">CBM</th><th style="width:15%" class="text-center">Pekerja</th><th style="width:15%" class="text-right">Total Biaya (Rp)</th></tr></thead>
                                <tbody>${mRows || '<tr><td colspan="7" class="text-center">Belum ada data muat.</td></tr>'}</tbody>
                            </table>
                            <div class="text-right" style="margin-bottom: 25px;"><b>Subtotal Muat: ${formatRupiah(tMuat)}</b></div>

                            <div class="clearfix">
                                <div class="summary-box">
                                    <div class="summary-row"><span>Total Upah Bongkar:</span><span>${formatRupiah(tBongkar)}</span></div>
                                    <div class="summary-row"><span>Total Upah Muat:</span><span>${formatRupiah(tMuat)}</span></div>
                                    <div class="summary-row summary-total"><span>GRAND TOTAL:</span><span>${formatRupiah(tBongkar + tMuat)}</span></div>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (type === 'rekap-global' && selectedDate) {
                    let rows = '';
                    let gUpah = 0, gCbm = 0, gCtn = 0;
                    containers.forEach(cont => {
                        let count = 1;
                        const dates = cont.muatDates || {};
                        const stats = cont.muatStatuses || {};
                        cont.items.forEach(itm => {

                                                            <span className="bg-gray-800 px-2.5 py-1 rounded-md border border-gray-700">Tarif: {formatRupiah(b.tarif)}</span>
                                                            <span className="bg-gray-800 px-2.5 py-1 rounded-md border border-gray-700">Konsumsi: {formatRupiah(b.konsumsi)}</span>
                                                            <span className={`px-2.5 py-1 rounded-md border ${b.insentif > 0 ? 'bg-emerald-900/30 text-emerald-400 border-emerald-900/50' : 'bg-gray-800 border-gray-700'}`}>Insentif: {formatRupiah(b.insentif)}</span>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center justify-between sm:justify-end gap-6 border-t border-gray-700 sm:border-0 pt-3 sm:pt-0 shrink-0">
                                                        <div className="text-[#00d4ff] font-extrabold text-base sm:text-lg">{formatRupiah(b.total)}</div>
                                                        <button onClick={() => deleteBongkar(b.id)} className="text-red-400 hover:text-white hover:bg-red-500/80 bg-red-400/10 p-2 sm:px-3 sm:py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1"><span className="hidden sm:inline">Hapus</span> 🗑️</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>

                                        <div className="flex flex-col sm:flex-row gap-3 border-t border-gray-800 pt-5 mt-auto">
                                            <button onClick={() => handleNativePrint('rekap-container', currentContainer.id)} className="flex-1 bg-gray-800 hover:bg-gray-700 border border-gray-600 text-white font-bold py-3.5 rounded-xl text-sm flex items-center justify-center gap-2 shadow-lg transition-all">
                                                🖨️ Cetak PDF Bongkar
                                            </button>
                                            <button onClick={() => sendWA('bongkar')} className="flex-1 bg-[#25D366] hover:bg-[#128C7E] text-white font-bold py-3.5 rounded-xl text-sm flex items-center justify-center gap-2 shadow-lg transition-all">
                                                💬 Kirim Laporan ke WA
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Modal Konfirmasi Hapus */}
                    {confirmDeleteId && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 bg-black/80 backdrop-blur-md animate-fade-in">
                            <div className="bg-[#1e293b] rounded-2xl p-6 sm:p-8 max-w-sm w-full border border-gray-700 shadow-2xl text-center">
                                <div className="w-16 h-16 sm:w-20 sm:h-20 bg-red-500/10 text-red-500 rounded-full flex items-center justify-center mx-auto mb-5 border border-red-500/20">
                                    <svg className="w-8 h-8 sm:w-10 sm:h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </div>
                                <h3 className="text-xl sm:text-2xl font-bold text-white mb-2">Hapus Arsip?</h3>
                                <p className="text-gray-400 text-xs sm:text-sm mb-6 sm:mb-8 leading-relaxed">Arsip kontainer ini beserta seluruh data rekapan upahnya akan dihapus permanen dari sistem. Anda yakin?</p>
                                <div className="flex justify-center gap-3">
                                    <button onClick={() => setConfirmDeleteId(null)} className="flex-1 py-3 bg-gray-800 hover:bg-gray-700 text-white rounded-lg text-sm font-bold transition-colors">Batal</button>
                                    <button onClick={() => {
                                        setContainers(containers.filter(c => c.id !== confirmDeleteId));
                                        if(activeContainerId === confirmDeleteId) setActiveModal(null);
                                        setConfirmDeleteId(null);
                                    }} className="flex-1 py-3 bg-red-500 hover:bg-red-600 text-white rounded-lg text-sm font-bold transition-all shadow-[0_4px_15px_rgba(239,68,68,0.4)]">Ya, Hapus</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
